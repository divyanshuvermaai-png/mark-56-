[project]
name = "jarvis-mark-56"
version = "0.1.0"
description = "A lightweight Gemini Live API voice assistant inspired by Tony Stark's JARVIS"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-genai>=2.3.0",
    "pyaudio>=0.2.14",
    "sounddevice>=0.5.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "openwakeword>=0.6.0",
    "numpy>=1.26.0",
    "onnxruntime>=1.16.0",
]

[project.scripts]
jarvis = "run:main"
